name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call tool `redmine_list_issues` with `{...}`
        2. ...
    validations:
      required: true
  - type: input
    id: redmine-version
    attributes:
      label: Redmine version
      placeholder: e.g. 5.1.2
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. v22.22.2
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (stderr from the server)
      render: shell
